<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decibel VU Meter</title>
    <link rel="stylesheet" href="./stylesheet/style.css">
</head>
<body>

    <div class="console-container">
        <h1>Decibel Meter</h1>
        <p>Geluidsniveaus in kaart gebracht. Boven de 85 dB is schadelijk!</p>

        <button id="startKnop" onclick="startMeter()">Start Meter</button>

        <div id="dbWeergave">0 dB</div>

        <div class="meter-box">
            <div class="meter-vulling" id="meterBalk"></div>
        </div>

        <div id="status">Wacht op start...</div>
    </div>

    <script>
        /* --- JAVASCRIPT CODE --- */
        
        let isWaarschuwingBezig = false; 
        let animatieLoop; // Bewaart de meet-loop zodat we hem kunnen stoppen

        async function startMeter() {
            let knop = document.getElementById('startKnop');
            let statusTekst = document.getElementById('status');
            
            knop.style.display = 'none';
            statusTekst.innerText = "Aan het luisteren...";
            statusTekst.classList.remove('foutmelding'); 
            statusTekst.style.color = "white"; // Reset kleur

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                // --- NIEUW: Controleer of de microfoon plotseling stopt of geblokkeerd wordt ---
                // We pakken de audio-verbinding (track) en luisteren of deze 'eindigt'
                stream.getAudioTracks()[0].onended = function() {
                    cancelAnimationFrame(animatieLoop); // Stop de continu meting
                    
                    // Zet alles terug op 0
                    document.getElementById('meterBalk').style.width = '0%';
                    document.getElementById('dbWeergave').innerText = "0 dB";
                    document.getElementById('dbWeergave').style.color = "#4CAF50";

                    // Laat de foutmelding zien
                    statusTekst.innerText = "❌ Microfoon verbinding verbroken of geblokkeerd!";
                    statusTekst.classList.add('foutmelding');
                    
                    // Laat de knop weer zien
                    knop.style.display = 'block';
                    knop.innerText = "Probeer opnieuw";
                };

                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const analyser = audioContext.createAnalyser();
                const microfoon = audioContext.createMediaStreamSource(stream);

                microfoon.connect(analyser);
                analyser.fftSize = 256; 

                const dataArray = new Uint8Array(analyser.frequencyBinCount);

                function meetGeluid() {
                    analyser.getByteFrequencyData(dataArray);

                    let som = 0;
                    for (let i = 0; i < dataArray.length; i++) {
                        som += dataArray[i];
                    }
                    let volume = som / dataArray.length; 

                    let percentage = (volume / 150) * 100; 
                    if (percentage > 100) percentage = 100;

                    let decibel = Math.round(percentage * 1.1); 
                    
                    document.getElementById('meterBalk').style.width = percentage + '%';
                    document.getElementById('dbWeergave').innerText = decibel + " dB";

                    let dbWeergave = document.getElementById('dbWeergave');
                    if (decibel < 75) {
                        dbWeergave.style.color = "#4CAF50"; // Groen
                    } else if (decibel < 85) {
                        dbWeergave.style.color = "#FFC107"; // Geel
                    } else {
                        dbWeergave.style.color = "#F44336"; // Rood
                    }

                    if (decibel >= 85 && isWaarschuwingBezig === false) {
                        geefWaarschuwing(decibel);
                    }

                    // Sla de loop op in de variabele 'animatieLoop' zodat we hem kunnen stoppen bij een fout
                    animatieLoop = requestAnimationFrame(meetGeluid);
                }

                meetGeluid(); 

            } catch (fout) {
                // Dit gebeurt als je aan het begin al weigert of geen microfoon hebt aangesloten
                statusTekst.innerText = "❌ Je hebt de microfoon geblokkeerd of er is geen microfoon gevonden!";
                statusTekst.classList.add('foutmelding');
                
                knop.style.display = 'block';
                knop.innerText = "Probeer opnieuw";
            }
        }

        function geefWaarschuwing(gemetenDb) {
            isWaarschuwingBezig = true; 

            let statusTekst = document.getElementById('status');
            statusTekst.innerText = "⚠️ GEVAARLIJK! " + gemetenDb + " dB IS THE HARD!!! ⚠️";
            statusTekst.style.color = "#F44336";
            statusTekst.classList.add('waarschuwing'); 

            let stem = new SpeechSynthesisUtterance("Warning!");
            stem.lang = "en-US"; 
            stem.volume = 1;     
            window.speechSynthesis.speak(stem);

            setTimeout(function() {
                isWaarschuwingBezig = false;
                
                // Zorg dat hij na de waarschuwing alleen "Aan het luisteren..." zegt 
                // als de microfoon ondertussen niet is geblokkeerd!
                if (!statusTekst.classList.contains('foutmelding')) {
                    statusTekst.innerText = "Aan het luisteren...";
                    statusTekst.style.color = "white";
                    statusTekst.classList.remove('waarschuwing'); 
                }
            }, 2500);
        }
    </script>
</body>
</html>
